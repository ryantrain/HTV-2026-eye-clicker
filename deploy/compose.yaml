services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      HOST: 0.0.0.0
    restart: unless-stopped
    expose:
      - '8787'
  caddy:
    image: caddy:2
    ports:
      - '80:80'
      - '443:443'
    environment:
      OMNI_DOMAIN: ${OMNI_DOMAIN:?Set OMNI_DOMAIN to your domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
